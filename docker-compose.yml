services:
  veridict-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      VERIDICT_STORAGE_DIR: /app/storage
    volumes:
      - ./backend/storage:/app/storage
      - veridict_uploads:/tmp/veridict_uploads
      - veridict_audit:/tmp/veridict_audit

  veridict-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - veridict-backend

volumes:
  veridict_uploads: {}
  veridict_audit: {}
